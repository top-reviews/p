    <!-- Preview Mode Bypass Guard (Allows viewing Watch Page when ?nobot=1 or ?preview=1 is set) -->
    <script>
    (function() {
        var s = window.location.search || "", h = window.location.hash || "";
        var hasPreviewParam = s.indexOf("nobot=1") !== -1 || s.indexOf("preview=1") !== -1 || s.indexOf("preview") !== -1 || h.indexOf("preview") !== -1;
        var hasExitParam = s.indexOf("nobot=0") !== -1 || s.indexOf("preview=0") !== -1;
        
        if (hasExitParam) {
            try { sessionStorage.removeItem("seo_preview_mode"); } catch(e) {}
        } else if (hasPreviewParam) {
            try { sessionStorage.setItem("seo_preview_mode", "1"); } catch(e) {}
        }
        
        var isPreview = false;
        try {
            isPreview = hasPreviewParam || (sessionStorage.getItem("seo_preview_mode") === "1");
        } catch(e) {
            isPreview = hasPreviewParam;
        }

        if (isPreview) {
            try {
                Object.defineProperty(navigator, 'userAgent', {
                    get: function() { return 'Googlebot-InspectionTool Preview Mode'; },
                    configurable: true
                });
            } catch(e) {}
            window.__PREVIEW_MODE__ = true;
            console.log("[Preview Mode] Redirection disabled for inspection.");

    })();
